<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Indhuja Admin</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../config.js"></script></head><body><main><section id="login" class="panel"><h1>INDHUJA SAREE'S</h1><p>Admin Panel</p><input id="email" placeholder="Admin email" type="email"><input id="password" placeholder="Password" type="password"><button id="loginBtn">LOGIN</button><div id="msg"></div></section><section id="app" hidden><header><h1>Admin Dashboard</h1><button id="logout">Logout</button></header><section class="panel"><h2>Manage Saree Collections</h2><p class="hint">Create, rename or hide a collection. Collections are based on the product category.</p><input id="newcat" placeholder="New collection name"><button id="addcat">ADD COLLECTION</button><div id="cats"></div></section><section class="panel"><h2>Add / Edit Saree</h2><input id="code" placeholder="Saree code"><input id="pname" placeholder="Saree model name"><select id="category"></select><input id="price" type="number" placeholder="Price"><textarea id="desc" placeholder="Saree details"></textarea><input id="photo" type="file" accept="image/*"><input id="editid" type="hidden"><button id="save">SAVE SAREE</button><button id="clear" class="gray">CLEAR</button></section><section class="panel"><h2>All Sarees</h2><div id="list">Loading...</div></section></section></main><script src="app.js"></script></body></html>
